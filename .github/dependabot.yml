# Three ecosystems: GitHub Actions, Composer and npm. Minor and patch bumps are
# merged by dependabot-auto-merge.yml — only once every other check on the PR
# has passed. Major bumps are left for a human.
#
# `cooldown` 7 days: a freshly published version waits a week before Dependabot
# proposes it. That is usually enough for a compromised or broken release to be
# pulled before it reaches us unreviewed. .npmrc applies the same rule to
# `npm install` (`min-release-age=7`).
#
# Groups bundle minor and patch bumps into ONE PR per ecosystem per week. Majors
# are left out of the groups on purpose — each arrives on its own, reviewable
# (and a grouped PR with a major in it would never be auto-merged).
#
# `commit-message`: PR titles must follow Conventional Commits (pr-title.yml),
# so Dependabot titles its PRs `chore(deps): ...`.
version: 2

# @private-start
registries:
  # Private packages (happenv-com/*) come from Packeton. The password is a
  # DEPENDABOT secret, not an Actions one — Dependabot cannot see Actions
  # secrets. CI running on Dependabot PRs gets the Dependabot secret too, so
  # without it `composer update` fails there with a 401.
  packeton:
    type: composer-repository
    url: https://packeton.happenv.com
    username: token
    password: ${{secrets.COMPOSER_PACKETON_TOKEN}}

# @private-end
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      github-actions:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'composer'
    directory: '/'
    # @private-start
    registries:
      - packeton
    # @private-end
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      composer:
        update-types:
          - 'minor'
          - 'patch'

  # @npm-start
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      npm:
        update-types:
          - 'minor'
          - 'patch'
  # @npm-end
